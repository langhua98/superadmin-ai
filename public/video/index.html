<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>视频解析播放</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0e0e11;
      color: #eaeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #23232a;
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 12px; color: #8a8a96; }
    .wrap { flex: 1; padding: 16px; max-width: 640px; margin: 0 auto; width: 100%; }
    .bar { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 12px 14px; font-size: 15px;
      background: #1a1a20; border: 1px solid #2c2c35; border-radius: 12px;
      color: #eaeaf0; outline: none;
    }
    input:focus { border-color: #4a7dff; }
    button {
      padding: 0 18px; height: 46px; font-size: 15px; font-weight: 600;
      background: #4a7dff; color: #fff; border: none; border-radius: 12px;
      cursor: pointer; white-space: nowrap;
    }
    button:disabled { opacity: .5; cursor: default; }
    .hint { margin-top: 10px; font-size: 12px; color: #8a8a96; line-height: 1.6; }
    .status { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .status.err { color: #ff6b6b; }
    .card {
      margin-top: 16px; background: #16161c; border: 1px solid #23232a;
      border-radius: 16px; overflow: hidden; display: none;
    }
    .card.show { display: block; }
    video { width: 100%; display: block; background: #000; max-height: 70vh; }
    .meta { padding: 14px 16px; }
    .meta .title { font-size: 15px; line-height: 1.5; }
    .meta .author { margin-top: 8px; font-size: 13px; color: #8a8a96; }
    .meta .dl { margin-top: 12px; }
    .meta .dl a { color: #4a7dff; font-size: 13px; text-decoration: none; }
    .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid #4a7dff;
      border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite;
      vertical-align: -2px; margin-right: 6px; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>视频解析播放</h1>
    <p>粘贴抖音 / 快手 / TikTok 分享链接</p>
  </header>
  <div class="wrap">
    <div class="bar">
      <input id="url" type="text" placeholder="粘贴分享链接，如 https://v.douyin.com/xxx/" autocomplete="off" />
      <button id="go">解析</button>
    </div>
    <div class="hint">
      从抖音 App 点「分享 → 复制链接」，粘贴到上方即可。视频为无水印版本，可直接播放或下载。
    </div>
    <div id="status" class="status"></div>
    <div id="card" class="card">
      <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="author" class="author"></div>
        <div class="dl"><a id="dl" href="#" target="_blank" rel="noopener">↓ 下载视频</a></div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://langhua1998-douyin-proxy.hf.space/parse";
    const $ = (id) => document.getElementById(id);
    const urlEl = $("url"), goEl = $("go"), statusEl = $("status");
    const cardEl = $("card"), playerEl = $("player"), titleEl = $("title"),
          authorEl = $("author"), dlEl = $("dl");

    function setStatus(msg, isErr) {
      statusEl.className = "status" + (isErr ? " err" : "");
      statusEl.innerHTML = msg;
    }

    async function parse() {
      const link = urlEl.value.trim();
      if (!link) { setStatus("请先粘贴链接", true); return; }
      goEl.disabled = true;
      cardEl.classList.remove("show");
      setStatus('<span class="spin"></span>解析中，首次唤醒服务器可能需要 30 秒…');
      try {
        const res = await fetch(API + "?url=" + encodeURIComponent(link));
        const data = await res.json();
        if (data.code !== 200 || !data.data) {
          throw new Error(data.message || "解析失败，请检查链接");
        }
        const d = data.data;
        const vd = d.video_data || {};
        const src = vd.nwm_video_url_HQ || vd.nwm_video_url || vd.wm_video_url_HQ || vd.wm_video_url;
        if (!src) throw new Error("未找到可播放的视频地址（可能是图集）");
        playerEl.src = src;
        dlEl.href = src;
        titleEl.textContent = d.desc || "";
        const author = d.author && (d.author.nickname || d.author.name);
        authorEl.textContent = author ? "作者：" + author : "";
        cardEl.classList.add("show");
        setStatus("解析成功 ✓");
        playerEl.play().catch(() => {});
      } catch (e) {
        setStatus((e && e.message) || "解析失败", true);
      } finally {
        goEl.disabled = false;
      }
    }

    goEl.addEventListener("click", parse);
    urlEl.addEventListener("keydown", (e) => { if (e.key === "Enter") parse(); });
  </script>
</body>
</html>
