name: Deploy to GitHub Pages

on:
    push:
        branches: ["main", "claude/web-ui-version-s6hidb"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install plugin dependencies
              run: |
                  npm ci --prefix plugins/macro
                  npm ci --prefix plugins/visual-programming

            - name: Build 3D app
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Build 2D app
              working-directory: webcad2d
              run: |
                  pnpm install
                  pnpm build

            - name: Merge 2D app into dist/2d
              run: cp -r webcad2d/packages/cad-viewer-example/dist dist/2d

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
