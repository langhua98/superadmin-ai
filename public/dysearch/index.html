<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>视频搜索</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0e0e11; color: #eaeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* 登录层 */
    #login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 14px; }
    #login h2 { font-size: 18px; font-weight: 600; }
    #login p { font-size: 13px; color: #8a8a96; line-height: 1.6; }
    #qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; object-fit: contain; }
    .spin { width: 26px; height: 26px; border: 3px solid #4a7dff; border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }

    /* 搜索栏 */
    #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
    .bar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #23232a; }
    .bar input { flex: 1; min-width: 0; padding: 11px 14px; font-size: 15px; background: #1a1a20; border: 1px solid #2c2c35; border-radius: 10px; color: #eaeaf0; outline: none; }
    .bar input:focus { border-color: #4a7dff; }
    .bar button { padding: 0 16px; font-size: 15px; font-weight: 600; background: #fe2c55; color: #fff; border: none; border-radius: 10px; }
    .status { padding: 8px 14px; font-size: 12px; color: #8a8a96; min-height: 18px; }

    /* 结果网格 */
    #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; align-content: start; }
    .card { background: #16161c; border-radius: 10px; overflow: hidden; cursor: pointer; }
    .card .thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #23232a; display: block; }
    .card .cap { padding: 8px; font-size: 12px; line-height: 1.4; }
    .card .cap .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .cap .author { color: #8a8a96; margin-top: 4px; }

    /* 播放层 */
    #player { position: fixed; inset: 0; background: #000; display: none; z-index: 50; }
    #player video { width: 100%; height: 100%; object-fit: contain; }
    #player .close { position: absolute; top: 14px; left: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; border: none; font-size: 20px; }
  </style>
</head>
<body>
  <div id="login">
    <h2 id="loginTitle">抖音验证码登录</h2>
    <div id="loginForm" style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;gap:8px;">
        <input id="phone" type="tel" inputmode="numeric" placeholder="手机号"
          style="flex:1;min-width:0;padding:12px 14px;font-size:15px;background:#1a1a20;border:1px solid #2c2c35;border-radius:10px;color:#eaeaf0;outline:none;" />
        <button id="sendCode" style="padding:0 14px;white-space:nowrap;font-size:14px;background:#4a7dff;color:#fff;border:none;border-radius:10px;">获取验证码</button>
      </div>
      <input id="code" type="tel" inputmode="numeric" placeholder="短信验证码"
        style="padding:12px 14px;font-size:15px;background:#1a1a20;border:1px solid #2c2c35;border-radius:10px;color:#eaeaf0;outline:none;" />
      <button id="doLogin" style="padding:13px;font-size:16px;font-weight:600;background:#fe2c55;color:#fff;border:none;border-radius:10px;">登录</button>
    </div>
    <p id="loginHint" style="max-width:320px;">建议用小号。首次点「获取验证码」要唤醒海外服务器，约 30-60 秒，请耐心等。</p>
    <p id="loginErr" style="color:#ff6b6b;font-size:13px;min-height:16px;"></p>
  </div>

  <div id="app">
    <div class="bar">
      <input id="kw" type="text" placeholder="搜索抖音视频，如 猫咪 / 美食" autocomplete="off" />
      <button id="go">搜索</button>
    </div>
    <div class="status" id="status"></div>
    <div id="grid"></div>
  </div>

  <div id="player">
    <button class="close" id="close">✕</button>
    <video id="video" controls playsinline webkit-playsinline></video>
  </div>

  <script>
    const API = "https://langhua1998-douyin-proxy.hf.space";
    const $ = (id) => document.getElementById(id);

    // ---- 短信验证码登录 ----
    function err(msg) { $("loginErr").textContent = msg || ""; }

    async function sendCode() {
      const phone = $("phone").value.trim();
      if (!/^\d{11}$/.test(phone)) { err("请输入 11 位手机号"); return; }
      err("");
      const btn = $("sendCode");
      btn.disabled = true;
      let s = 0;
      btn.textContent = "启动中…0s";
      const tick = setInterval(() => { s++; btn.textContent = "启动中…" + s + "s"; }, 1000);
      try {
        await fetch(API + "/", { cache: "no-store" }).catch(() => {});
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 90000);
        const r = await fetch(API + "/login/sms/send?phone=" + encodeURIComponent(phone),
          { signal: ctrl.signal, cache: "no-store" });
        clearTimeout(to);
        const d = await r.json();
        clearInterval(tick);
        if (d.already_logged_in) { showApp(); return; }
        if (d.code !== 200) throw new Error(d.message || "发送失败");
        if (d.captcha_maybe) err("抖音弹了滑块验证，请重试或稍后再试");
        // 60 秒倒计时
        let cd = 60;
        btn.textContent = cd + "s";
        const cdTimer = setInterval(() => {
          cd--; btn.textContent = cd + "s";
          if (cd <= 0) { clearInterval(cdTimer); btn.disabled = false; btn.textContent = "获取验证码"; }
        }, 1000);
      } catch (e) {
        clearInterval(tick);
        btn.disabled = false; btn.textContent = "获取验证码";
        err(e.name === "AbortError" ? "超时，服务器较慢，请重试" : String(e.message || e));
      }
    }

    async function doLogin() {
      const code = $("code").value.trim();
      if (!code) { err("请输入验证码"); return; }
      err("");
      const btn = $("doLogin");
      btn.disabled = true; btn.textContent = "登录中…";
      try {
        const r = await fetch(API + "/login/sms/verify?code=" + encodeURIComponent(code), { cache: "no-store" });
        const d = await r.json();
        if (d.logged_in) { showApp(); return; }
        let m = "登录未成功";
        if (d.hint) m += "：" + d.hint;
        else if (d.login_api && d.login_api.length) {
          const j = d.login_api[d.login_api.length - 1].json;
          const desc = j && (j.description || j.message || (j.data && j.data.description));
          if (desc) m += "：" + desc;
        } else m += "（可能验证码已过期，请重新获取）";
        err(m);
      } catch (e) {
        err(String(e.message || e));
      } finally {
        btn.disabled = false; btn.textContent = "登录";
      }
    }

    $("sendCode").onclick = sendCode;
    $("doLogin").onclick = doLogin;

    function showApp() {
      $("login").style.display = "none";
      $("app").style.display = "flex";
    }

    // ---- 搜索 ----
    async function search() {
      const kw = $("kw").value.trim();
      if (!kw) return;
      $("status").textContent = "搜索中…";
      $("grid").innerHTML = "";
      try {
        const r = await fetch(API + "/bsearch?keyword=" + encodeURIComponent(kw));
        const d = await r.json();
        if (d.code !== 200) throw new Error(d.message || "搜索失败");
        $("status").textContent = "找到 " + d.count + " 个结果";
        for (const v of d.data) renderCard(v);
        if (!d.count) $("status").textContent = "没搜到结果，换个词试试";
      } catch (e) {
        $("status").textContent = "搜索失败：" + (e.message || e);
      }
    }

    function renderCard(v) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="' + (v.cover || "") + '">' +
        '<div class="cap"><div class="desc">' + esc(v.desc || "无标题") + '</div>' +
        '<div class="author">@' + esc(v.author || "") + '</div></div>';
      card.onclick = () => play(v.play_url);
      $("grid").appendChild(card);
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---- 播放 ----
    function play(url) {
      const src = API + "/stream?url=" + encodeURIComponent(url);
      $("video").src = src;
      $("player").style.display = "block";
      $("video").play().catch(() => {});
    }
    $("close").onclick = () => {
      $("player").style.display = "none";
      $("video").pause(); $("video").src = "";
    };

    $("go").onclick = search;
    $("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

    // 打开即预热服务器 + 检查是否已登录（服务器未重启则免登录）
    (async () => {
      try {
        const r = await fetch(API + "/login/check", { cache: "no-store" });
        const d = await r.json();
        if (d.logged_in) showApp();
      } catch (e) {}
    })();
  </script>
</body>
</html>
