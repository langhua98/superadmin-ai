<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>拍照建模 · 高斯泼溅</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0e0e11; color: #eaeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    header { padding: 12px 16px; text-align: center; border-bottom: 1px solid #23232a; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: #8a8a96; margin-top: 3px; }
    .wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* 相机 */
    .camera { position: relative; background: #000; aspect-ratio: 3/4; max-height: 56vh; overflow: hidden; }
    .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .camera .hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); font-size: 12px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    .shutter { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 4px solid rgba(255,255,255,.4); }
    .shutter:active { transform: translateX(-50%) scale(.92); }

    /* 缩略图条 */
    .shots { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid #23232a; min-height: 62px; align-items: center; }
    .shots .empty { color: #6a6a76; font-size: 12px; }
    .shots img { height: 46px; width: 46px; object-fit: cover; border-radius: 6px; flex: 0 0 auto; }

    /* 操作区 */
    .bar { padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
    .count { font-size: 13px; color: #8a8a96; flex: 1; }
    button.primary { padding: 12px 18px; font-size: 15px; font-weight: 600; border: none; border-radius: 12px;
      background: #4a7dff; color: #fff; }
    button.primary:disabled { opacity: .45; }
    button.ghost { padding: 8px 12px; font-size: 13px; background: #23232a; color: #eaeaf0; border: none; border-radius: 10px; }

    .status { padding: 0 16px 10px; font-size: 13px; color: #8a8a96; min-height: 18px; text-align: center; }
    .status.err { color: #ff6b6b; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #4a7dff; border-top-color: transparent;
      border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes r { to { transform: rotate(360deg); } }

    /* 结果 */
    #result { display: none; flex: 1; flex-direction: column; }
    #result video { width: 100%; max-height: 46vh; background: #000; }
    #splat { flex: 1; min-height: 240px; background: #000; }
    .rbar { padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .rbar a, .rbar button { text-decoration: none; }
    .tip { padding: 0 16px 14px; font-size: 12px; color: #8a8a96; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>拍照建模 · 高斯泼溅</h1>
    <p>绕物体拍多张 → 云端 GPU 重建 → 彩色 3D</p>
  </header>

  <div class="wrap" id="capture">
    <div class="camera">
      <video id="cam" autoplay playsinline muted></video>
      <div class="hint" id="camHint">绕物体一圈，多角度各拍一张</div>
      <button class="shutter" id="shutter" aria-label="拍照"></button>
    </div>
    <div class="shots" id="shots"><span class="empty">还没拍照片</span></div>
    <div class="bar">
      <span class="count" id="count">0 张（建议 8~20 张）</span>
      <button class="ghost" id="clear">清空</button>
      <button class="primary" id="gen" disabled>开始建模</button>
    </div>
    <div class="status" id="status"></div>
    <div class="tip">
      提示：物体要**有纹理**、光线均匀；每张之间挪一点、保持重叠；纯色墙、玻璃、反光物体容易失败。
      首次建模因云端冷启动可能等 1~3 分钟。
    </div>
  </div>

  <div id="result">
    <video id="resVideo" controls playsinline loop autoplay muted></video>
    <div id="splat"></div>
    <div class="rbar">
      <a class="primary" id="dlPly" href="#" download="model.ply" style="display:none;">下载 .ply 泼溅</a>
      <button class="ghost" id="view3d" style="display:none;">在 3D 里查看泼溅</button>
      <button class="ghost" id="again">重新拍</button>
    </div>
    <div class="tip">上方是重建预览视频。点「在 3D 里查看泼溅」可加载可旋转的彩色高斯泼溅（较大，稍等）。</div>
  </div>

  <script type="module">
    const HF_SPACE = "langhua1998/room-splat";
    const $ = (id) => document.getElementById(id);
    const shots = [];       // {blob, url}
    let stream = null;

    // ---------- 相机 ----------
    async function initCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } },
          audio: false,
        });
        $("cam").srcObject = stream;
      } catch (e) {
        setStatus("无法打开相机：" + (e.message || e) + "（需 HTTPS + 授权）", true);
      }
    }
    function capture() {
      const v = $("cam");
      if (!v.videoWidth) return;
      const c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      c.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        shots.push({ blob, url });
        renderShots();
      }, "image/jpeg", 0.9);
    }
    function renderShots() {
      const el = $("shots");
      if (!shots.length) { el.innerHTML = '<span class="empty">还没拍照片</span>'; }
      else {
        el.innerHTML = "";
        shots.forEach((s) => { const img = new Image(); img.src = s.url; el.appendChild(img); });
        el.scrollLeft = el.scrollWidth;
      }
      $("count").textContent = shots.length + " 张（建议 8~20 张）";
      $("gen").disabled = shots.length < 3;
    }
    function setStatus(msg, err) {
      const s = $("status"); s.className = "status" + (err ? " err" : ""); s.innerHTML = msg || "";
    }

    $("shutter").onclick = capture;
    $("clear").onclick = () => { shots.forEach(s => URL.revokeObjectURL(s.url)); shots.length = 0; renderShots(); setStatus(""); };
    $("again").onclick = () => location.reload();

    // ---------- 建模(调 HF Space)----------
    $("gen").onclick = async () => {
      if (shots.length < 3) return;
      $("gen").disabled = true;
      setStatus('<span class="spin"></span>连接云端 GPU…');
      try {
        const { Client } = await import("https://esm.sh/@gradio/client@1");
        const app = await Client.connect(HF_SPACE);
        setStatus('<span class="spin"></span>上传照片、重建中…（冷启动可能 1~3 分钟）');
        const files = shots.map((s, i) => new File([s.blob], `img_${i}.jpg`, { type: "image/jpeg" }));
        const sub = app.submit("/process", [files]);
        let out = null;
        for await (const msg of sub) {
          if (msg.type === "status") {
            if (msg.stage === "error") throw new Error(msg.message || "云端重建报错");
            else setStatus('<span class="spin"></span>排队/重建中…' + (msg.position != null ? `（队列 ${msg.position}）` : ""));
          } else if (msg.type === "data") {
            out = msg.data;
          }
        }
        if (!out) throw new Error("没有返回结果（可能超时或 GPU 繁忙，请重试）");
        showResult(out);
      } catch (e) {
        setStatus("建模失败：" + (e.message || e) + "。可重试；或减少/更换照片。", true);
        $("gen").disabled = false;
      }
    };

    function fileUrl(x) {
      if (!x) return null;
      if (typeof x === "string") return x;
      return x.url || (x.video && (x.video.url || x.video)) || null;
    }
    function showResult(data) {
      // data = [video, ply, model3d]
      const videoUrl = fileUrl(data[0]);
      const plyUrl = fileUrl(data[1]);
      $("capture").style.display = "none";
      $("result").style.display = "flex";
      if (videoUrl) { $("resVideo").src = videoUrl; $("resVideo").play().catch(()=>{}); }
      if (plyUrl) {
        $("dlPly").href = plyUrl; $("dlPly").style.display = "inline-block";
        $("view3d").style.display = "inline-block";
        $("view3d").onclick = () => loadSplat(plyUrl);
      }
    }

    // ---------- 高斯泼溅查看器(按需加载)----------
    async function loadSplat(plyUrl) {
      $("view3d").disabled = true;
      $("view3d").textContent = "加载中…";
      try {
        const GS = await import("https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4");
        const el = $("splat");
        el.style.minHeight = "300px";
        const viewer = new GS.Viewer({
          rootElement: el,
          selfDrivenMode: true,
          sharedMemoryForWorkers: false,
        });
        await viewer.addSplatScene(plyUrl, { format: GS.SceneFormat.Ply, showLoadingUI: true });
        viewer.start();
        $("view3d").style.display = "none";
      } catch (e) {
        $("view3d").disabled = false;
        $("view3d").textContent = "在 3D 里查看泼溅";
        setStatus("泼溅查看器加载失败(可先看上方视频或下载 .ply):" + (e.message || e), true);
      }
    }

    initCam();
  </script>
</body>
</html>
