<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>拍照建模 · 高斯泼溅</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0e0e11; color: #eaeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    header { padding: 10px 16px; text-align: center; border-bottom: 1px solid #23232a; }
    header h1 { font-size: 15px; font-weight: 600; }
    header p { font-size: 11px; color: #8a8a96; margin-top: 2px; }
    /* 场景模式选择 */
    .modes { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .chip { padding: 7px 14px; font-size: 13px; font-weight: 600; border: 1px solid #2f2f38;
      border-radius: 999px; background: #1a1a20; color: #b6b6c2; }
    .chip.on { background: #4a7dff; border-color: #4a7dff; color: #fff; }
    .wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* 相机 */
    .camera { position: relative; background: #000; flex: 1; min-height: 300px; overflow: hidden; }
    .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 引导 HUD */
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .guide { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.6); font-size: 15px; font-weight: 600; padding: 8px 16px; border-radius: 999px; white-space: nowrap; }
    .ring { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); width: 128px; height: 128px; }
    .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    .flash.on { opacity: .5; transition: opacity .05s; }
    .counter { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.6); font-size: 12px; padding: 5px 10px; border-radius: 999px; }

    /* 底部控制 */
    .ctrl { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; pointer-events: auto; }
    .shutter { width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 4px solid rgba(255,255,255,.45); }
    .shutter:active { transform: scale(.92); }
    .autobtn { padding: 12px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 999px; background: #4a7dff; color: #fff; }
    .autobtn.on { background: #21c07a; }

    .shots { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid #23232a; min-height: 60px; align-items: center; }
    .shots .empty { color: #6a6a76; font-size: 12px; }
    .shots img { height: 44px; width: 44px; object-fit: cover; border-radius: 6px; flex: 0 0 auto; }

    .bar { padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #23232a; }
    .count { font-size: 13px; color: #8a8a96; flex: 1; }
    button.primary { padding: 11px 18px; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; background: #4a7dff; color: #fff; }
    button.primary:disabled { opacity: .45; }
    button.ghost { padding: 8px 12px; font-size: 13px; background: #23232a; color: #eaeaf0; border: none; border-radius: 10px; }
    .status { padding: 0 16px 8px; font-size: 13px; color: #8a8a96; min-height: 18px; text-align: center; }
    .status.err { color: #ff6b6b; }
    /* 进度条 */
    #prog { display: none; margin: 0 16px 12px; }
    #prog .track { height: 8px; background: #23232a; border-radius: 999px; overflow: hidden; }
    #prog .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#4a7dff,#21c07a); border-radius: 999px; transition: width .5s ease; }
    #prog .steps { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #6a6a76; }
    #prog .steps span.on { color: #4a7dff; font-weight: 600; }
    /* 查看器操作提示 */
    #splatHint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #eaeaf0; font-size: 12px; padding: 6px 14px; border-radius: 999px; pointer-events: none; z-index: 5; transition: opacity .6s; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #4a7dff; border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes r { to { transform: rotate(360deg); } }

    #result { display: none; flex: 1; flex-direction: column; }
    #result video { width: 100%; max-height: 46vh; background: #000; }
    #splat { flex: 1; min-height: 240px; background: #000; }
    .rbar { padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tip { padding: 6px 16px 14px; font-size: 12px; color: #8a8a96; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>拍照建模 · 高斯泼溅</h1>
    <p>选场景 → 按指引拍够角度 → 云端 GPU 重建彩色 3D</p>
    <div class="modes" id="modes">
      <button class="chip on" data-mode="object">🧊 物体</button>
      <button class="chip" data-mode="room">🏠 房间</button>
      <button class="chip" data-mode="street">🏙️ 街道</button>
    </div>
  </header>

  <div class="wrap" id="capture">
    <div class="camera">
      <video id="cam" autoplay playsinline muted></video>
      <div class="hud">
        <div class="guide" id="guide">对准物体，点「自动拍摄」开始</div>
        <div class="counter" id="counter">0 张</div>
        <svg class="ring" id="ring" viewBox="0 0 100 100" style="display:none"></svg>
        <div class="flash" id="flash"></div>
      </div>
      <div class="ctrl">
        <button class="shutter" id="shutter" aria-label="手动拍"></button>
        <button class="autobtn" id="auto">自动拍摄</button>
      </div>
    </div>
    <div class="shots" id="shots"><span class="empty">还没拍照片</span></div>
    <div class="bar">
      <span class="count" id="count">0 张（一圈约需 16 张）</span>
      <button class="ghost" id="clear">清空</button>
      <button class="primary" id="gen" disabled>开始建模</button>
    </div>
    <div class="status" id="status"></div>
    <div id="prog">
      <div class="track"><div class="fill" id="progFill"></div></div>
      <div class="steps">
        <span id="s1">上传</span><span id="s2">启动GPU</span><span id="s3">重建中</span><span id="s4">完成</span>
      </div>
    </div>
    <div class="tip" id="tipBody">
      <b>物体模式</b>：点「自动拍摄」并授权方向感应，然后<b>端着手机绕物体走一圈、镜头朝里</b>，对准没拍过的角度会自动咔嚓；下方圆环显示已覆盖的方位。<b>8~12 张均匀视角就够</b>，不必贪多。物体要有纹理、光线均匀；纯色墙/玻璃/反光易失败。
    </div>
  </div>

  <div id="result">
    <video id="resVideo" controls playsinline loop autoplay muted></video>
    <div id="splat"></div>
    <div class="rbar">
      <a class="primary" id="dlPly" href="#" download="model.ply" style="display:none;">下载 .ply</a>
      <button class="ghost" id="view3d" style="display:none;">在 3D 里查看泼溅</button>
      <button class="ghost" id="again">重新拍</button>
    </div>
    <div class="tip">上方是重建预览视频。点「在 3D 里查看泼溅」加载可旋转的彩色高斯泼溅（较大，稍等）。</div>
  </div>

  <script type="module">
    const HF_SPACE = "langhua1998/room-splat";
    const $ = (id) => document.getElementById(id);
    const shots = [];
    const N = 16;                          // 一圈分 16 个扇区
    let covered = new Array(N).fill(false);
    let heading = null;                    // 当前朝向 0-360
    let autoOn = false;
    let lastCapHeading = -999, lastMoveT = 0, lastH = null;

    // ---------- 场景模式 ----------
    // 高斯泼溅(InstantSplat)是稀疏视图重建,GPU 单次上限 150s、耗时随图数≈O(n²)。
    // 8~12 张均匀视角最稳;拍再多也只会等距挑 MAX_UPLOAD 张送去建模。
    const MAX_UPLOAD = 12;
    const MODES = {
      object: {
        ring: true, cap: 16, rec: "8~12",
        start: "对准物体，点「自动拍摄」开始",
        count: "（均匀 8~12 张即可）",
        tip: "<b>物体模式</b>：点「自动拍摄」并授权方向感应，然后<b>端着手机绕物体走一圈、镜头朝里</b>，对准没拍过的角度会自动咔嚓；下方圆环显示已覆盖的方位。<b>8~12 张均匀视角就够</b>，不必贪多。物体要有纹理、光线均匀；纯色墙/玻璃/反光易失败。",
      },
      room: {
        ring: true, cap: 18, rec: "10~12",
        start: "站在房间中央，点「自动拍摄」原地慢转",
        count: "（均匀 10~12 张即可）",
        tip: "<b>房间模式</b>：站在房间中央，点「自动拍摄」并授权方向感应，<b>原地慢转一圈、镜头朝外</b>填满圆环即可。<b>10~12 张均匀视角最稳</b>，别贪多。转角、家具、有纹理的墙效果好；纯白墙、大玻璃、反光易破洞，小房间比大房间稳。",
      },
      street: {
        ring: false, cap: 16, rec: "10~12", interval: 2500,
        start: "边走边拍：点「自动拍摄」每 2.5 秒一张",
        count: "（均匀 10~12 张即可）",
        tip: "<b>街道 / 户外模式</b>：点「自动拍摄」后<b>边走边拍、镜头朝前或朝建筑</b>，每 2.5 秒自动一张；保持向前、相邻两张要有重叠。<b>10~12 张、范围别贪大</b>——单个建筑立面、一小段街景效果最好，整条大街会打折、易破洞。",
      },
    };
    let mode = "object";
    let loopCount = 0;                      // 房间模式已转的圈数
    let streetTimer = null;
    const cfg = () => MODES[mode];

    // ---------- 相机 ----------
    let camStream = null;
    async function initCam() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
        camStream = s; $("cam").srcObject = s;
      } catch (e) { setStatus("无法打开相机：" + (e.message || e) + "（需 HTTPS + 授权）", true); }
    }
    // 释放摄像头(关掉相机指示灯、省电);建模开始后不再需要取景
    function stopCam() {
      const v = $("cam");
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; v.srcObject = null; }
    }
    function capture() {
      const v = $("cam"); if (!v.videoWidth) return;
      const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      c.toBlob((blob) => { shots.push({ blob, url: URL.createObjectURL(blob) }); renderShots(); flash(); }, "image/jpeg", 0.9);
    }
    function flash() { const f = $("flash"); f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 90); }
    function renderShots() {
      const el = $("shots");
      if (!shots.length) el.innerHTML = '<span class="empty">还没拍照片</span>';
      else { el.innerHTML = ""; shots.forEach(s => { const i = new Image(); i.src = s.url; el.appendChild(i); }); el.scrollLeft = el.scrollWidth; }
      $("count").textContent = shots.length + " 张" + cfg().count;
      $("counter").textContent = shots.length + " 张";
      $("gen").disabled = shots.length < 3;
      // 到达张数上限:自动停拍,防止 GPU 超时
      if (shots.length >= cfg().cap && autoOn) { stopAuto(); $("guide").textContent = "照片够了 ✓ 点「开始建模」"; setStatus("已达上限，去建模吧"); }
    }
    function setStatus(m, e) { const s = $("status"); s.className = "status" + (e ? " err" : ""); s.innerHTML = m || ""; }

    // ---------- 覆盖环 ----------
    function buildRing() {
      const r = $("ring"); r.innerHTML = ""; r.style.display = "block";
      for (let i = 0; i < N; i++) {
        const a0 = (i / N) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / N) * 2 * Math.PI - Math.PI / 2;
        const R = 46, r2 = 30, cx = 50, cy = 50;
        const p = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
        const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r2), [x3, y3] = p(a0, r2);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r2} ${r2} 0 0 0 ${x3} ${y3} Z`);
        path.setAttribute("id", "sec" + i);
        path.setAttribute("fill", "rgba(255,255,255,.14)");
        path.setAttribute("stroke", "rgba(0,0,0,.3)"); path.setAttribute("stroke-width", "0.5");
        r.appendChild(path);
      }
      // 中心朝向箭头
      const arrow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      arrow.setAttribute("id", "hdot"); arrow.setAttribute("r", "3"); arrow.setAttribute("fill", "#4a7dff");
      arrow.setAttribute("cx", "50"); arrow.setAttribute("cy", "50"); r.appendChild(arrow);
    }
    function updateRing() {
      for (let i = 0; i < N; i++) $("sec" + i)?.setAttribute("fill", covered[i] ? "#21c07a" : "rgba(255,255,255,.14)");
      if (heading != null) {
        const a = (heading / 360) * 2 * Math.PI - Math.PI / 2;
        $("hdot")?.setAttribute("cx", (50 + 38 * Math.cos(a)).toFixed(1));
        $("hdot")?.setAttribute("cy", (50 + 38 * Math.sin(a)).toFixed(1));
      }
    }
    function guidance() {
      const done = covered.filter(Boolean).length;
      if (done >= N) {
        if (mode === "room") {
          // 房间:一圈满 → 清空环,提示换位置再转一圈,继续累积
          loopCount++; covered = new Array(N).fill(false); updateRing();
          $("guide").textContent = `第 ${loopCount} 圈完成 ✓ 走到另一个角落，继续原地转`;
        } else {
          $("guide").textContent = "这一圈拍完 ✓ 抬高/放低再转一圈，或点开始建模";
        }
        return;
      }
      // 找最近的缺口方向
      const cur = heading == null ? 0 : Math.floor(heading / (360 / N)) % N;
      let nearest = -1, best = 99;
      for (let d = 1; d < N; d++) {
        if (!covered[(cur + d) % N] && d < best) { best = d; nearest = (cur + d) % N; break; }
        if (!covered[(cur - d + N) % N]) { nearest = (cur - d + N) % N; break; }
      }
      // 判断左右
      let dir = "转动手机";
      if (nearest >= 0) {
        let diff = ((nearest - cur + N) % N);
        dir = diff <= N / 2 ? "→ 向右转" : "← 向左转";
        if (!covered[cur]) dir = "对准物体，稍停";
      }
      $("guide").textContent = `${dir}　已覆盖 ${done}/${N}`;
    }

    // ---------- 方向感应 + 自动拍 ----------
    function onOrient(e) {
      let h = (typeof e.webkitCompassHeading === "number") ? e.webkitCompassHeading
            : (e.alpha != null ? (360 - e.alpha) : null);
      if (h == null) return;
      heading = (h % 360 + 360) % 360;
      const now = performance.now();
      // 稳定性:朝向变化慢才算"停稳"
      if (lastH != null) { const dh = Math.abs(((heading - lastH + 540) % 360) - 180); if (dh > 2) lastMoveT = now; }
      lastH = heading;
      updateRing(); guidance();
      if (!autoOn) return;
      const sec = Math.floor(heading / (360 / N)) % N;
      const steady = (now - lastMoveT) > 250;       // 稳定 250ms
      const moved = Math.abs(((heading - lastCapHeading + 540) % 360) - 180) > (360 / N) * 0.6;
      if (!covered[sec] && steady && moved && shots.length < cfg().cap) {
        covered[sec] = true; lastCapHeading = heading; capture(); updateRing(); guidance();
      }
    }
    async function startAuto() {
      if (shots.length >= cfg().cap) { setStatus("照片够了，去建模吧"); return; }
      // 街道模式:平移拍摄,罗盘环不适用 → 定时间隔自动拍
      if (mode === "street") {
        autoOn = true; $("auto").textContent = "自动中·点停"; $("auto").classList.add("on");
        $("guide").textContent = "继续向前走，兼顾两侧";
        setStatus("边走边拍：保持向前、相邻两张有重叠");
        streetTimer = setInterval(() => {
          if (shots.length >= cfg().cap) { stopAuto(); return; }
          capture();
          $("guide").textContent = `继续向前走，兼顾两侧　已拍 ${shots.length + 1}`;
        }, cfg().interval);
        return;
      }
      // 物体 / 房间:靠方向感应,进入新扇区就拍
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const p = await DeviceOrientationEvent.requestPermission();
          if (p !== "granted") { setStatus("未授权方向感应，只能手动拍。", true); return; }
        }
        window.addEventListener("deviceorientation", onOrient, true);
        autoOn = true; buildRing(); $("auto").textContent = "自动中·点停"; $("auto").classList.add("on");
        setStatus(mode === "room" ? "原地慢转一圈，镜头朝外，缺口会自动补拍" : "端着手机绕物体走一圈，缺口会自动补拍");
      } catch (e) { setStatus("方向感应不可用，用手动快门吧：" + (e.message || e), true); }
    }
    function stopAuto() {
      autoOn = false; $("auto").textContent = "自动拍摄"; $("auto").classList.remove("on");
      if (streetTimer) { clearInterval(streetTimer); streetTimer = null; }
    }

    // ---------- 模式切换 ----------
    function setMode(m) {
      if (!MODES[m] || m === mode) return;
      stopAuto();
      mode = m; loopCount = 0; covered = new Array(N).fill(false);
      document.querySelectorAll("#modes .chip").forEach(c => c.classList.toggle("on", c.dataset.mode === m));
      $("ring").style.display = "none";
      $("guide").textContent = cfg().start;
      $("tipBody").innerHTML = cfg().tip;
      renderShots();
    }
    document.querySelectorAll("#modes .chip").forEach(c => { c.onclick = () => setMode(c.dataset.mode); });

    $("auto").onclick = () => autoOn ? stopAuto() : startAuto();
    $("shutter").onclick = capture;
    $("clear").onclick = () => { stopAuto(); shots.forEach(s => URL.revokeObjectURL(s.url)); shots.length = 0; covered = new Array(N).fill(false); loopCount = 0; updateRing(); renderShots(); setStatus(""); };
    $("again").onclick = () => location.reload();

    // ---------- 建模(经中转 Space:浏览器→中转带token调GPU→轮询取结果)----------
    const RELAY = "https://langhua1998-splat-relay.hf.space";
    function setProg(step, pct) {
      $("prog").style.display = "block";
      $("progFill").style.width = Math.max(0, Math.min(100, pct)) + "%";
      [1, 2, 3, 4].forEach(i => $("s" + i).classList.toggle("on", i === step));
    }
    // 等距挑 k 张(含首末),避免图太多超 GPU 150s 时长 → "GPU task aborted"
    function pickEven(arr, k) {
      if (arr.length <= k) return arr.slice();
      const out = [];
      for (let i = 0; i < k; i++) out.push(arr[Math.round(i * (arr.length - 1) / (k - 1))]);
      return out;
    }
    $("gen").onclick = async () => {
      if (shots.length < 3) return;
      stopAuto(); stopCam(); $("gen").disabled = true;   // 建模开始 → 释放摄像头
      try {
        const use = pickEven(shots, MAX_UPLOAD);
        setProg(1, 8);
        setStatus('<span class="spin"></span>' + (shots.length > MAX_UPLOAD
          ? `从 ${shots.length} 张里挑了 ${use.length} 张最均匀的上传（少而匀 → 更快更稳）…`
          : "上传照片…"));
        const fd = new FormData();
        use.forEach((s, i) => fd.append("files", new File([s.blob], `img_${i}.jpg`, { type: "image/jpeg" })));
        const sub = await fetch(RELAY + "/submit", { method: "POST", body: fd });
        if (!sub.ok) throw new Error("上传失败 HTTP " + sub.status);
        const info = await sub.json();
        if (info.error) throw new Error(info.error);
        const jobId = info.job_id;

        const EST = 120;                             // ~12 张热机约 120s;冷启动更久时条会停在 ~92%
        const t0 = Date.now();
        setProg(2, 15);
        while (Date.now() - t0 < 600000) {           // 最多 10 分钟
          await new Promise(r => setTimeout(r, 3000));
          let st;
          try { st = await (await fetch(RELAY + "/status/" + jobId, { cache: "no-store" })).json(); }
          catch (e) { continue; }                    // 单次轮询失败不致命,继续
          const secs = Math.round((Date.now() - t0) / 1000);
          if (st.state === "done") {
            setProg(4, 100);
            showResult([st.video_url ? RELAY + st.video_url : null, st.ply_url ? RELAY + st.ply_url : null]);
            return;
          }
          if (st.state === "error") {
            const m = st.message || "";
            if (/abort|duration|timeout|out of memory|CUDA/i.test(m))
              throw new Error("GPU 超时/显存不足。已自动只送均匀 12 张，若仍失败：请重拍——保证有纹理、光线均匀、相邻两张有足够重叠。");
            throw new Error(m || "重建出错(照片可能太少/无法匹配/物体无纹理)");
          }
          const pct = Math.min(92, 15 + (secs / EST) * 77);
          const cold = secs > EST;
          setProg(3, pct);
          setStatus('<span class="spin"></span>重建中… ' + secs + 's' + (cold ? '（冷启动较慢，请再等等，勿关页面）' : '（约 2 分钟，勿关页面）'));
        }
        throw new Error("超时，请重试(可减少张数或换有纹理的物体)");
      } catch (e) {
        $("prog").style.display = "none";
        setStatus("建模失败：" + (e.message || e), true);
        $("gen").disabled = false;
        if (!camStream) initCam();          // 失败 → 恢复取景,方便补拍/重试
      }
    };

    function fileUrl(x) { if (!x) return null; if (typeof x === "string") return x; return x.url || (x.video && (x.video.url || x.video)) || null; }
    function showResult(data) {
      const videoUrl = fileUrl(data[0]), plyUrl = fileUrl(data[1]);
      $("capture").style.display = "none"; $("result").style.display = "flex";
      if (videoUrl) { $("resVideo").src = videoUrl; $("resVideo").play().catch(() => {}); }
      if (plyUrl) { $("dlPly").href = plyUrl; $("dlPly").style.display = "inline-block"; $("view3d").style.display = "inline-block"; $("view3d").onclick = () => loadSplat(plyUrl); }
    }
    async function loadSplat(plyUrl) {
      $("view3d").disabled = true; $("view3d").textContent = "加载中…";
      try {
        const { GS } = await import("./vendor/gsplat.js");
        const el = $("splat");
        el.style.minHeight = "60vh"; el.style.position = "relative";
        const viewer = new GS.Viewer({
          rootElement: el, selfDrivenMode: true, sharedMemoryForWorkers: false,
          useBuiltInControls: true, dynamicScene: false,
        });
        await viewer.addSplatScene(plyUrl, { format: GS.SceneFormat.Ply, showLoadingUI: true });
        viewer.start();
        // 平滑、好用的触摸控制:单指转、双指缩放+平移、带阻尼
        const c = viewer.controls;
        if (c) {
          c.enableDamping = true; c.dampingFactor = 0.08;
          c.rotateSpeed = 0.7; c.zoomSpeed = 1.3; c.panSpeed = 0.8;
          c.enablePan = true; c.screenSpacePanning = true;
          c.minDistance = 0.05; c.maxDistance = 2000; c.zoomToCursor = true;
        }
        $("view3d").style.display = "none";
        // 操作提示,几秒后淡出
        const hint = document.createElement("div");
        hint.id = "splatHint"; hint.textContent = "单指旋转 · 双指缩放/平移";
        el.appendChild(hint);
        setTimeout(() => { hint.style.opacity = "0"; }, 4000);
      } catch (e) {
        $("view3d").disabled = false; $("view3d").textContent = "在 3D 里查看泼溅";
        setStatus("查看器加载失败(可看视频或下载.ply):" + (e.message || e), true);
      }
    }

    initCam();
    renderShots();
  </script>
</body>
</html>
