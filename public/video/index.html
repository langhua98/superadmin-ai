<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>刷视频</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 竖向整屏滑动容器 */
    #feed {
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .slide {
      position: relative;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .slide video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* 加载 / 错误提示 */
    .tip {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9a9aa5; font-size: 14px; pointer-events: none; gap: 8px;
    }
    .tip.hide { display: none; }
    .spin { width: 22px; height: 22px; border: 3px solid #4a7dff; border-top-color: transparent;
      border-radius: 50%; animation: r .8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }

    /* 静音提示 */
    .muted-badge {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff; font-size: 13px;
      padding: 7px 14px; border-radius: 999px; pointer-events: none;
      transition: opacity .4s; z-index: 5;
    }
    .muted-badge.gone { opacity: 0; }

    /* 右下操作提示 */
    .hint {
      position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,.5); font-size: 12px; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="feed"></div>
  <div class="muted-badge" id="mutedBadge">🔇 点击开启声音</div>
  <div class="hint">上滑看下一个</div>

  <script>
    // 随机短视频源（自托管 mp4，直连可播，无需后端）。
    // 多个源轮换，某个挂了自动跳过。
    const SOURCES = [
      "https://tucdn.wpon.cn/api-girl/index.php?wpon=302",
      "https://api.kuleu.com/api/MP4_xiaojiejie?type=302",
    ];
    let srcIndex = 0;
    function nextVideoUrl() {
      const base = SOURCES[srcIndex % SOURCES.length];
      srcIndex++;
      // 加随机参数强制每次取不同视频、避免缓存
      const sep = base.includes("?") ? "&" : "?";
      return base + sep + "_=" + Date.now() + Math.floor(Math.random() * 1e6);
    }

    const feed = document.getElementById("feed");
    const mutedBadge = document.getElementById("mutedBadge");
    let globalMuted = true;      // 首屏必须静音才能自动播放
    const KEEP = 6;              // 内存里最多保留的 slide 数

    function makeSlide() {
      const slide = document.createElement("div");
      slide.className = "slide";

      const tip = document.createElement("div");
      tip.className = "tip";
      tip.innerHTML = '<span class="spin"></span>加载中';
      slide.appendChild(tip);

      const video = document.createElement("video");
      video.src = nextVideoUrl();
      video.loop = true;
      video.muted = globalMuted;
      video.playsInline = true;
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("preload", "auto");

      video.addEventListener("canplay", () => tip.classList.add("hide"));
      // 某个视频加载失败 → 换个源重试一次
      let retried = false;
      video.addEventListener("error", () => {
        if (!retried) { retried = true; video.src = nextVideoUrl(); video.load(); }
        else { tip.innerHTML = "加载失败，上滑跳过"; tip.classList.remove("hide"); }
      });

      slide.appendChild(video);
      slide._video = video;
      return slide;
    }

    // 初始化若干张
    function ensureSlides(n) {
      while (feed.children.length < n) feed.appendChild(makeSlide());
    }
    ensureSlides(3);

    // 播放当前可见的、暂停其它的
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        const v = e.target._video;
        if (!v) return;
        if (e.isIntersecting && e.intersectionRatio > 0.6) {
          v.muted = globalMuted;
          v.play().catch(() => {});
          // 快到底了就补新的
          const idx = Array.prototype.indexOf.call(feed.children, e.target);
          if (idx >= feed.children.length - 2) ensureSlides(feed.children.length + 2);
          // 回收顶部过多的 slide，控制内存
          while (feed.children.length > KEEP && idx > 2) {
            feed.removeChild(feed.firstChild);
            break;
          }
        } else {
          v.pause();
        }
      });
    }, { threshold: [0, 0.6, 1] });

    // 观察所有 slide（含后续新增）
    const mo = new MutationObserver((muts) => {
      muts.forEach((m) => m.addedNodes.forEach((n) => { if (n.classList && n.classList.contains("slide")) io.observe(n); }));
    });
    mo.observe(feed, { childList: true });
    Array.from(feed.children).forEach((s) => io.observe(s));

    // 点击开启/关闭声音
    document.body.addEventListener("click", () => {
      globalMuted = !globalMuted;
      Array.from(feed.children).forEach((s) => { if (s._video) s._video.muted = globalMuted; });
      if (!globalMuted) {
        mutedBadge.classList.add("gone");
        // 确保当前视频在播
        Array.from(feed.children).forEach((s) => {
          const r = s.getBoundingClientRect();
          if (r.top >= -10 && r.top < window.innerHeight * 0.5 && s._video) s._video.play().catch(() => {});
        });
      } else {
        mutedBadge.textContent = "🔇 点击开启声音";
        mutedBadge.classList.remove("gone");
      }
    });

    // 首个视频尝试自动播放
    window.addEventListener("load", () => {
      const first = feed.children[0];
      if (first && first._video) first._video.play().catch(() => {});
    });
  </script>
</body>
</html>
