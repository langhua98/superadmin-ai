<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>视频搜索</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0e0e11; color: #eaeaf0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* 登录层 */
    #login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 14px; }
    #login h2 { font-size: 18px; font-weight: 600; }
    #login p { font-size: 13px; color: #8a8a96; line-height: 1.6; }
    #qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; object-fit: contain; }
    .spin { width: 26px; height: 26px; border: 3px solid #4a7dff; border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }

    /* 搜索栏 */
    #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
    .bar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #23232a; }
    .bar input { flex: 1; min-width: 0; padding: 11px 14px; font-size: 15px; background: #1a1a20; border: 1px solid #2c2c35; border-radius: 10px; color: #eaeaf0; outline: none; }
    .bar input:focus { border-color: #4a7dff; }
    .bar button { padding: 0 16px; font-size: 15px; font-weight: 600; background: #fe2c55; color: #fff; border: none; border-radius: 10px; }
    .status { padding: 8px 14px; font-size: 12px; color: #8a8a96; min-height: 18px; }

    /* 结果网格 */
    #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; align-content: start; }
    .card { background: #16161c; border-radius: 10px; overflow: hidden; cursor: pointer; }
    .card .thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #23232a; display: block; }
    .card .cap { padding: 8px; font-size: 12px; line-height: 1.4; }
    .card .cap .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .cap .author { color: #8a8a96; margin-top: 4px; }

    /* 播放层 */
    #player { position: fixed; inset: 0; background: #000; display: none; z-index: 50; }
    #player video { width: 100%; height: 100%; object-fit: contain; }
    #player .close { position: absolute; top: 14px; left: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; border: none; font-size: 20px; }
  </style>
</head>
<body>
  <div id="login">
    <h2 id="loginTitle">抖音验证码登录</h2>
    <div id="loginForm" style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;gap:8px;">
        <select id="cc" style="padding:12px 8px;font-size:14px;background:#1a1a20;border:1px solid #2c2c35;border-radius:10px;color:#eaeaf0;outline:none;">
          <option value="1">🇺🇸 +1</option>
          <option value="86">🇨🇳 +86</option>
        </select>
        <input id="phone" type="tel" inputmode="numeric" placeholder="手机号"
          style="flex:1;min-width:0;padding:12px 14px;font-size:15px;background:#1a1a20;border:1px solid #2c2c35;border-radius:10px;color:#eaeaf0;outline:none;" />
      </div>
      <button id="sendCode" style="padding:12px;white-space:nowrap;font-size:15px;background:#4a7dff;color:#fff;border:none;border-radius:10px;">获取验证码</button>
      <input id="code" type="tel" inputmode="numeric" placeholder="短信验证码"
        style="padding:12px 14px;font-size:15px;background:#1a1a20;border:1px solid #2c2c35;border-radius:10px;color:#eaeaf0;outline:none;" />
      <button id="doLogin" style="padding:13px;font-size:16px;font-weight:600;background:#fe2c55;color:#fff;border:none;border-radius:10px;">登录</button>
    </div>
    <p id="loginHint" style="max-width:320px;">建议用小号。首次点「获取验证码」要唤醒海外服务器，约 30-60 秒，请耐心等。</p>
    <p id="loginErr" style="color:#ff6b6b;font-size:13px;min-height:16px;"></p>
  </div>

  <div id="app">
    <div class="bar">
      <input id="kw" type="text" placeholder="搜索抖音视频，如 猫咪 / 美食" autocomplete="off" />
      <button id="go">搜索</button>
    </div>
    <div class="status" id="status"></div>
    <div id="grid"></div>
  </div>

  <!-- 滑块验证层 -->
  <div id="captcha" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;">
    <p style="color:#eaeaf0;font-size:15px;">拖动下方滑块，让缺口对齐</p>
    <div id="capWrap" style="position:relative;">
      <img id="capImg" style="display:block;border-radius:8px;max-width:90vw;" />
      <div id="capGuide" style="position:absolute;top:0;bottom:0;width:2px;background:#fe2c55;left:0;pointer-events:none;opacity:.8;"></div>
    </div>
    <div id="capTrack" style="position:relative;height:44px;background:#1a1a20;border:1px solid #2c2c35;border-radius:22px;touch-action:none;">
      <div id="capThumb" style="position:absolute;left:0;top:0;width:44px;height:44px;background:#fe2c55;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;touch-action:none;">›</div>
    </div>
    <p id="capStatus" style="color:#8a8a96;font-size:13px;min-height:16px;"></p>
    <button id="capRefresh" style="padding:8px 18px;font-size:14px;background:#333;color:#fff;border:none;border-radius:10px;">换一张</button>
  </div>

  <div id="player">
    <button class="close" id="close">✕</button>
    <video id="video" controls playsinline webkit-playsinline></video>
  </div>

  <script>
    const API = "https://langhua1998-douyin-proxy.hf.space";
    const $ = (id) => document.getElementById(id);

    // 安全请求：非 JSON / 出错时抛出可读信息，避免 iOS "string did not match" 崩溃
    async function getJSON(url, opts) {
      const r = await fetch(url, Object.assign({ cache: "no-store" }, opts || {}));
      const text = await r.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("服务器返回异常(HTTP " + r.status + ")：" + text.slice(0, 80));
      }
    }

    // ---- 短信验证码登录 ----
    function err(msg) { $("loginErr").textContent = msg || ""; }

    async function sendCode() {
      const cc = $("cc").value;
      const phone = $("phone").value.replace(/\D/g, "");
      if (cc === "86" && !/^\d{11}$/.test(phone)) { err("中国号码为 11 位"); return; }
      if (cc === "1" && !/^\d{10}$/.test(phone)) { err("美国号码为 10 位（不含 +1）"); return; }
      err("");
      const btn = $("sendCode");
      btn.disabled = true;
      let s = 0;
      btn.textContent = "启动中…0s";
      const tick = setInterval(() => { s++; btn.textContent = "启动中…" + s + "s"; }, 1000);
      try {
        await fetch(API + "/", { cache: "no-store" }).catch(() => {});
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 90000);
        const d = await getJSON(API + "/login/sms/send?phone=" + encodeURIComponent(phone) + "&cc=" + cc,
          { signal: ctrl.signal });
        clearTimeout(to);
        clearInterval(tick);
        if (d.already_logged_in) { showApp(); return; }
        if (d.code !== 200) throw new Error(d.message || "发送失败");
        if (d.captcha_maybe) err("抖音弹了滑块验证，请重试或稍后再试");
        // 60 秒倒计时
        let cd = 60;
        btn.textContent = cd + "s";
        const cdTimer = setInterval(() => {
          cd--; btn.textContent = cd + "s";
          if (cd <= 0) { clearInterval(cdTimer); btn.disabled = false; btn.textContent = "获取验证码"; }
        }, 1000);
      } catch (e) {
        clearInterval(tick);
        btn.disabled = false; btn.textContent = "获取验证码";
        err(e.name === "AbortError" ? "超时，服务器较慢，请重试" : String(e.message || e));
      }
    }

    async function doLogin() {
      const code = $("code").value.trim();
      if (!code) { err("请输入验证码"); return; }
      err("");
      const btn = $("doLogin");
      btn.disabled = true; btn.textContent = "登录中…";
      try {
        const d = await getJSON(API + "/login/sms/verify?code=" + encodeURIComponent(code));
        if (d.logged_in) { showApp(); return; }
        if (d.captcha) { showCaptcha(d); return; }
        let m = "登录未成功";
        if (d.hint) m += "：" + d.hint;
        else if (d.login_api && d.login_api.length) {
          const j = d.login_api[d.login_api.length - 1].json;
          const desc = j && (j.description || j.message || (j.data && j.data.description));
          if (desc) m += "：" + desc;
        } else m += "（可能验证码已过期，请重新获取）";
        err(m);
      } catch (e) {
        err(String(e.message || e));
      } finally {
        btn.disabled = false; btn.textContent = "登录";
      }
    }

    $("sendCode").onclick = sendCode;
    $("doLogin").onclick = doLogin;

    function showApp() {
      $("login").style.display = "none";
      $("app").style.display = "flex";
      $("captcha").style.display = "none";
    }

    // ---- 滑块验证 ----
    let capState = null; // { realWidth, dispWidth }
    function showCaptcha(payload) {
      $("captcha").style.display = "flex";
      $("capStatus").textContent = "";
      const img = $("capImg");
      img.onload = () => {
        const disp = img.clientWidth;         // displayed px
        const real = (payload.captcha_box && payload.captcha_box.width) || img.naturalWidth;
        capState = { real, disp };
        // track same width as image
        $("capTrack").style.width = disp + "px";
        resetThumb();
      };
      img.src = payload.image;
    }
    function resetThumb() {
      $("capThumb").style.left = "0px";
      $("capGuide").style.left = "22px";
    }

    (function setupDrag() {
      const thumb = $("capThumb"), track = $("capTrack"), guide = $("capGuide");
      let dragging = false, startX = 0, cur = 0, maxX = 0;
      function down(e) {
        dragging = true;
        maxX = track.clientWidth - thumb.clientWidth;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) - cur;
        e.preventDefault();
      }
      function move(e) {
        if (!dragging) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        cur = Math.max(0, Math.min(maxX, cx - startX));
        thumb.style.left = cur + "px";
        guide.style.left = (cur + 22) + "px";
        e.preventDefault();
      }
      async function up() {
        if (!dragging) return;
        dragging = false;
        if (!capState || cur < 5) return;
        // convert displayed px -> real captcha px
        const realDx = cur * (capState.real / capState.disp);
        $("capStatus").textContent = "验证中…";
        try {
          const d = await getJSON(API + "/captcha/drag?dx=" + Math.round(realDx));
          if (d.logged_in) { showApp(); return; }
          if (d.captcha && d.image) { $("capStatus").textContent = "没对齐，再试一次"; showCaptcha(d); }
          else { $("capStatus").textContent = "验证未通过，点「换一张」重试"; }
        } catch (e) { $("capStatus").textContent = "出错：" + (e.message || e); }
      }
      thumb.addEventListener("mousedown", down);
      thumb.addEventListener("touchstart", down, { passive: false });
      window.addEventListener("mousemove", move);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("mouseup", up);
      window.addEventListener("touchend", up);
    })();

    $("capRefresh").onclick = async () => {
      $("capStatus").textContent = "刷新中…";
      try {
        const d = await getJSON(API + "/captcha/state");
        if (d.logged_in) { showApp(); return; }
        if (d.captcha && d.image) showCaptcha(d);
        else $("capStatus").textContent = "没有检测到滑块，返回重新登录";
      } catch (e) { $("capStatus").textContent = String(e.message || e); }
    };

    // ---- 搜索 ----
    async function search() {
      const kw = $("kw").value.trim();
      if (!kw) return;
      $("status").textContent = "搜索中…";
      $("grid").innerHTML = "";
      try {
        const d = await getJSON(API + "/bsearch?keyword=" + encodeURIComponent(kw));
        if (d.code !== 200) throw new Error(d.message || "搜索失败");
        $("status").textContent = "找到 " + d.count + " 个结果";
        for (const v of d.data) renderCard(v);
        if (!d.count) $("status").textContent = "没搜到结果，换个词试试";
      } catch (e) {
        $("status").textContent = "搜索失败：" + (e.message || e);
      }
    }

    function renderCard(v) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="' + (v.cover || "") + '">' +
        '<div class="cap"><div class="desc">' + esc(v.desc || "无标题") + '</div>' +
        '<div class="author">@' + esc(v.author || "") + '</div></div>';
      card.onclick = () => play(v.play_url);
      $("grid").appendChild(card);
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---- 播放 ----
    function play(url) {
      const src = API + "/stream?url=" + encodeURIComponent(url);
      $("video").src = src;
      $("player").style.display = "block";
      $("video").play().catch(() => {});
    }
    $("close").onclick = () => {
      $("player").style.display = "none";
      $("video").pause(); $("video").src = "";
    };

    $("go").onclick = search;
    $("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

    // 打开即预热服务器 + 检查是否已登录（服务器未重启则免登录）
    (async () => {
      try {
        const d = await getJSON(API + "/login/check");
        if (d.logged_in) showApp();
      } catch (e) {}
    })();
  </script>
</body>
</html>
